<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voa Pipa!</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0b1020;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; overflow: hidden; color: #fff;
    }
    #game { position: relative; display: flex; flex-direction: column; align-items: center; }
    canvas { display: block; border-radius: 12px; box-shadow: 0 0 40px rgba(0,0,20,.8); height: calc(100vh - 70px); width: auto; max-width: 100vw; }
    #hud {
      width: 100%; display: flex; justify-content: space-between; padding: 8px 6px;
      font-size: 15px; font-weight: 700; letter-spacing: 1px; text-shadow: 0 1px 3px rgba(0,0,0,.6);
    }
    #hud span { color: #ffd166; }
    #mapBtn {
      background: #1b2440; border: 2px solid #ffd166; color: #ffd166; border-radius: 8px;
      font-size: 16px; padding: 3px 8px; cursor: pointer; transition: .15s;
    }
    #mapBtn:active { transform: scale(.9); }
    #mapHint {
      position: absolute; top: 44px; left: 50%; transform: translateX(-50%);
      background: rgba(6,12,28,.85); padding: 8px 16px; border-radius: 10px;
      font-weight: 800; letter-spacing: 1px; font-size: 14px; color: #ffd166;
      border: 2px solid #ffd166; box-shadow: 0 4px 14px rgba(0,0,0,.5); z-index: 5;
    }
    #overlay {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      flex-direction: column; background: rgba(6,12,28,.9); border-radius: 12px; z-index: 10;
      text-align: center; padding: 20px; backdrop-filter: blur(3px); overflow-y: auto;
    }
    #overlay h1 { font-size: 34px; letter-spacing: 2px; margin-bottom: 4px; }
    #overlay .sub { color: #bbb; font-size: 14px; margin-bottom: 16px; opacity: .9; max-width: 300px; }
    .row { display: flex; gap: 10px; margin: 6px 0; flex-wrap: wrap; justify-content: center; }
    .secLabel { font-size: 13px; color: #ffd166; font-weight: 700; margin-top: 10px; letter-spacing: 1px; }
    .pick {
      border-radius: 12px; padding: 10px 14px; cursor: pointer; font-size: 13px; font-weight: 700;
      border: 3px solid transparent; transition: .15s; background: #1b2440;
    }
    .pick:hover { transform: translateY(-2px); }
    .pick.sel { border-color: #ffd166; }
    #playBtn {
      margin: 18px 0 6px; padding: 16px 44px; font-size: 22px; font-weight: 800; border: none;
      border-radius: 14px; background: linear-gradient(180deg,#ffd166,#f0a500); color: #222;
      cursor: pointer; letter-spacing: 2px; box-shadow: 0 8px 24px rgba(255,180,0,.45); transition: .2s;
    }
    #playBtn:hover { transform: scale(1.07); }
    #result { font-size: 20px; line-height: 1.7; margin: 10px 0; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="game">
    <div id="hud">
      <div>Pipas: <span id="lives">3</span> · Pontos: <span id="score">0</span></div>
      <div style="display:flex;align-items:center;gap:8px;">
        <button id="mapBtn" onclick="cycleMap()">🗺️</button>
        <div>🪙 <span id="coins">0</span></div>
        <div>· <span id="best">0</span></div>
      </div>
    </div>
    <div id="mapHint" class="hidden">🗺️</div>
    <canvas id="cv" width="720" height="1280"></canvas>
    <div id="overlay">
      <h1>🪁 Voa Pipa!</h1>
      <div class="sub">Solte sua pipa no céu, pegue estrelas e nuvens mágicas! Desvie dos pássaros e do vento forte.</div>

      <div class="secLabel">🎨 Cor da pipa</div>
      <div class="row" id="kiteRow"></div>

      <div class="secLabel">🛍️ Loja de Pipa 🪙 <span id="shopCoins">0</span></div>
      <div class="row" id="shopRow"></div>

      <div class="secLabel">🗺️ Escolha o mapa (céu)</div>
      <div class="row" id="mapRow"></div>

      <button id="playBtn" onclick="startGame()">▶️ Jogar</button>
      <div id="result" class="hidden"></div>
    </div>
  </div>

  <script>
    const cv = document.getElementById('cv');
    const ctx = cv.getContext('2d');
    const W = 360, H = 640;
    const UI_Scale = 2;              // canvas físico 720x1280 -> lógico 360x640
    ctx.scale(UI_Scale, UI_Scale);

    const KITES = [
      { name: 'Pipa',      tipo: 'losango', top: '#e63946', bot: '#f28482', tail: '#e63946', cost: 0,  emoji: '🪁' },
      { name: 'Papagaio',  tipo: 'papagaio', top: '#ffd166', bot: '#ff9f1c', tail: '#ff9f1c', cost: 30, emoji: '🦜' },
      { name: 'Tesoura',   tipo: 'tesoura', top: '#3a86ff', bot: '#4cc9f0', tail: '#3a86ff', cost: 60, emoji: '✂️' },
      { name: 'Arraia',    tipo: 'arraia', top: '#2d6a4f', bot: '#74c69d', tail: '#2d6a4f', cost: 90, emoji: '🦂' },
      { name: 'Estrela',   tipo: 'estrela', top: '#8338ec', bot: '#b388ff', tail: '#8338ec', cost: 130, emoji: '⭐' },
      { name: 'Quadrada',  tipo: 'quadrada', top: '#f56040', bot: '#f9a26c', tail: '#f56040', cost: 180, emoji: '⬛' }
    ];

    // dinheiro e pipas desbloqueadas (persistem no navegador)
    let coins = (parseInt(localStorage.getItem('pipaCoins'))|0);
    let unlocked = (() => {
      try { const u = JSON.parse(localStorage.getItem('pipaUnlocked') || '{"0":true}'); const o = {}; o[0]=true; KITES.forEach((_,i)=>{ if(u[i]) o[i]=true; }); return o; }
      catch(e){ return {0:true}; }
    })();
    function saveMoney() {
      localStorage.setItem('pipaCoins', coins);
      localStorage.setItem('pipaUnlocked', JSON.stringify(unlocked));
      const c = document.getElementById('coins'); if (c) c.textContent = coins;
      const s = document.getElementById('shopCoins'); if (s) s.textContent = coins;
    }

    const MAPS = [
      { name: 'Dia',      sky: ['#6ec6ff','#c8f0ff'], clouds:['#fff','#f0f8ff'], birds: 0.5, gust: 0.018, cloudCol:'rgba(255,255,255,.9)' },
      { name: 'Tarde',    sky: ['#ff9e5e','#ffd6a5'], clouds:['#ffe3c9','#ffd9b8'], birds: 0.6, gust: 0.02,  cloudCol:'rgba(255,230,200,.9)' },
      { name: 'Noite',    sky: ['#0f1b3d','#2c3e6b'], clouds:['#3a4a70','#4a5a80'], birds: 0.6, gust: 0.025, cloudCol:'rgba(90,110,160,.85)', stars:true },
      { name: 'Tempestade', sky: ['#2b2d42','#4a4e69'], clouds:['#4a4a5a','#5a5a6a'], birds: 0.7, gust: 0.05,  cloudCol:'rgba(70,70,90,.9)', storm:true }
    ];

    const GROUND = H*0.72; // altura do chão onde o menino/pipa encostam
    let mapIdx = 0, kiteIdx = 0;
    let best = (localStorage.getItem('pipaBest')|0);
    document.getElementById('best').textContent = best;

    const clouds = [];
    for (let i = 0; i < 8; i++) clouds.push({ x: Math.random()*W, y: 20 + Math.random()*(H*0.6), w: 50 + Math.random()*80, v: 0.2 + Math.random()*0.5 });
    const starsBg = [];
    for (let i = 0; i < 40; i++) starsBg.push({ x: Math.random()*W, y: Math.random()*H*0.5, s: Math.random()*2+0.5, t: Math.random()*6 });

    // ---------- menu ----------
    function buildMenu() {
      const kr = document.getElementById('kiteRow');
      kr.innerHTML = '';
      KITES.forEach((k, i) => {
        const have = unlocked[i];
        kr.innerHTML += '<div class="pick' + (i===kiteIdx?' sel':'') + '" onclick="selectKite('+i+')">' +
          k.emoji + ' ' + k.name + (have ? '' : ' 🔒') + '</div>';
      });
      buildShop();
      const mr = document.getElementById('mapRow');
      mr.innerHTML = '';
      MAPS.forEach((m, i) => {
        mr.innerHTML += '<div class="pick' + (i===mapIdx?' sel':'') + '" onclick="selectMap('+i+')">' + (i===0?'☀️':i===1?'🌇':i===2?'🌙':'⛈️') + ' ' + m.name + '</div>';
      });
      saveMoney();
    }
    function buildShop() {
      const sr = document.getElementById('shopRow');
      sr.innerHTML = '';
      KITES.forEach((k, i) => {
        const have = unlocked[i];
        sr.innerHTML += '<div class="pick' + (i===kiteIdx?' sel':'') + '" onclick="' + (have ? 'selectKite('+i+')' : 'buyKite('+i+')') + '">' +
          k.emoji + ' ' + k.name + (have ? ' <small style="color:#4ecdc4">✓</small>' : ' <small>🪙' + k.cost + '</small>') + '</div>';
      });
    }
    function selectKite(i) {
      if (!unlocked[i]) { buyKite(i); return; }
      kiteIdx = i; buildMenu();
    }
    function selectMap(i) { mapIdx = i; buildMenu(); }
    // troca o mapa durante o jogo (botão 🗺️ ou tecla M)
    function cycleMap() {
      mapIdx = (mapIdx + 1) % MAPS.length;
      const nm = MAPS[mapIdx];
      const hint = document.getElementById('mapHint');
      if (hint) { hint.textContent = '🗺️ ' + nm.name; hint.classList.remove('hidden'); clearTimeout(hint._t); hint._t = setTimeout(() => hint.classList.add('hidden'), 1200); }
    }
    function buyKite(i) {
      const k = KITES[i];
      if (unlocked[i]) { selectKite(i); return; }
      if (coins < k.cost) return;
      coins -= k.cost;
      unlocked[i] = true;
      kiteIdx = i;
      saveMoney();
      buildMenu();
    }
    buildMenu();

    // ---------- estado do jogo ----------
    let running = false, phase = 'idle';
    let score = 0, lives = 3, time = 0;
    let kite = { x: W*0.5, y: H*0.42, vx: 0, vy: 0, flap: 0 };
    let baseX = W*0.5, baseY = H - 16; // o menino segurando a linha
    // mão do menino (ponto de onde sai a linha) — deslocada conforme o boneco desenhado
    function handPos() { return { x: baseX + 7, y: baseY - 46 }; }
    const MAX_DIST = Math.hypot(W, H)*0.55;
    let pickups = [], birds = [], gusts = [], particles = [], enemies = [];
    let spawnT = 0, wind = 0, windPhase = 0, invuln = 0, cutFl = 0; // cutFl = flash de corte
    // pessoas soltando pipa no cenário (NPCs)
    let npcs = [];
    function initNPCs() {
      npcs = [];
      const pos = [[W*0.14, W*0.4], [W*0.86, W*0.75], [W*0.3, W*0.6]];
      const cols = [['#e63946','#f28482'], ['#3a86ff','#4cc9f0'], ['#ffd166','#ff9f1c']];
      for (let i = 0; i < pos.length; i++) {
        npcs.push({
          px: pos[i][0],           // posição da pessoa no chão
          kx: pos[i][1],           // posição da pipa no céu
          ky: 60 + i * 40,
          bob: Math.random()*6,
          col: cols[i],
          size: 20 + Math.random()*8
        });
      }
    }
    initNPCs();

    const keys = {};
    addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; e.preventDefault(); });
    addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
    // tecla M troca o céu
    addEventListener('keydown', e => { if (['m','ç'].includes(e.key.toLowerCase())) cycleMap(); });

    // touch para celular
    let touch = null;
    cv.addEventListener('touchstart', e => { touch = e.touches[0]; }, { passive:false });
    cv.addEventListener('touchmove', e => { touch = e.touches[0]; e.preventDefault(); }, { passive:false });
    cv.addEventListener('touchend', () => { touch = null; });

    function startGame() {
      document.getElementById('result').classList.add('hidden');
      document.getElementById('overlay').classList.add('hidden');
      score = 0; lives = 3; time = 0; pickups = []; birds = []; gusts = []; particles = []; enemies = [];
      spawnT = 0; wind = 0; invuln = 0;
      kite.x = W*0.5; kite.y = H*0.42; kite.vx = 0; kite.vy = 0;
      document.getElementById('score').textContent = 0;
      document.getElementById('lives').textContent = 3;
      saveMoney();
      running = true; phase = 'play';
      requestAnimationFrame(loop);
    }

    // soma pontos e ganha moedas (1 ponto = 1 moeda)
    function addScore(n) {
      score += n;
      coins += n;
      document.getElementById('score').textContent = score;
      saveMoney();
    }

    // entra no jogo direto ao abrir a página
    window.addEventListener('load', () => startGame());

    function gameOver(win) {
      running = false; phase = 'over';
      if (score > best) { best = score; localStorage.setItem('pipaBest', best); document.getElementById('best').textContent = best; }
      const r = document.getElementById('result');
      r.classList.remove('hidden');
      r.innerHTML = (win ? '🏆 Olha sua pipa no céu!' : '😅 A pipa caiu...') +
        '<br>Pontos: <b>' + score + '</b> · Recorde: <b>' + best + '</b>' +
        '<br>🪙 Moedas para a loja: <b>' + coins + '</b>';
      saveMoney();
      document.getElementById('overlay').classList.remove('hidden');
    }

    // ---------- desenho ----------
    const Y0 = () => 0; // marcador (substituído por uso direto)
    function shade(hex, amt) {
      if (hex.length === 4) hex = '#' + hex[1]+hex[1]+hex[2]+hex[2]+hex[3]+hex[3];
      const n = parseInt(hex.slice(1), 16);
      const r = Math.max(0, Math.min(255, (n>>16) + amt));
      const g = Math.max(0, Math.min(255, ((n>>8)&255) + amt));
      const b = Math.max(0, Math.min(255, (n&255) + amt));
      return 'rgb(' + r + ',' + g + ',' + b + ')';
    }
    const abs = Math.abs;

    function drawString(x, y, cur) {
      const Hd = handPos();
      // linha com curvatura natural (sag) conforme vento/tensão
      const dist = Math.hypot(x - Hd.x, y - Hd.y);
      const tension = Math.max(0, Math.min(1, 1 - (dist / MAX_DIST) * 0.3));
      ctx.strokeStyle = 'rgba(235,235,235,' + (0.35 + tension*0.35) + ')';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(Hd.x, Hd.y);
      const sag = (1 - tension) * (0.35 + Math.abs(cur)*0.5) * Math.abs(Hd.y - y);
      const mx = (Hd.x + x) / 2 + cur * (H*0.4);
      const my = (Hd.y + y) / 2 + sag + Math.sin(time*0.02)*2;
      ctx.quadraticCurveTo(mx, my, x, y);
      ctx.stroke();
      // brilho na linha
      ctx.strokeStyle = 'rgba(255,255,255,.15)';
      ctx.lineWidth = 0.5;
      ctx.beginPath();
      ctx.moveTo(Hd.x, Hd.y);
      ctx.quadraticCurveTo(mx-2, my-2, x-1, y-1);
      ctx.stroke();
    }

    function drawKite(x, y, s, flap) {
      const k = KITES[kiteIdx];
      const rot = Math.sin(time*0.06)*0.08 + Math.sin(kite.flap*0.02)*0.04;

      // sombra no "chão" se estiver baixa
      const groundProj = GROUND;
      if (y > groundProj - s*2) {
        ctx.fillStyle = 'rgba(0,0,0,' + Math.max(0, 0.25 * ((y - (groundProj - s*2))/40)) + ')';
        ctx.beginPath();
        ctx.ellipse(x, groundProj, s*0.6, 5, 0, 0, Math.PI*2);
        ctx.fill();
      }

      // rabiola (fita ondulada que flutua com o vento)
      ctx.strokeStyle = k.tail;
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      ctx.beginPath();
      const tailN = 14;
      let px = x, py = y + s*0.6, anchorY = y;
      for (let i = 0; i <= tailN; i++) {
        const t = i / tailN;
        const wob = Math.sin(time*0.12 + i*0.6 + Math.sin(time*0.05)) * (6 + t*8);
        const nx = x - t*s*0.9 - wob;
        const ny = y + t*s*1.25 + Math.sin(time*0.15 + i*0.4)* (5 + t*6);
        if (i > 0) ctx.lineTo(nx, ny);
        else ctx.moveTo(nx, ny);
        px = nx; py = ny; anchorY = ny;
      }
      ctx.stroke();
      // pontas de papel na rabiola
      for (let i = 0; i <= 6; i++) {
        const t = i/6;
        const wob = Math.sin(time*0.12 + i*2.2)* (5 + t*7);
        const nx = x - t*s*0.7 - wob*1.4;
        const ny = y + t*s*1.1 + Math.sin(time*0.15 + i*1.7)*(4 + t*5);
        ctx.strokeStyle = k.top;
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(nx, ny); ctx.lineTo(nx - 3, ny + 7); ctx.stroke();
      }

      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rot);
      ctx.shadowColor = 'rgba(0,0,0,.35)';
      ctx.shadowBlur = 5;
      ctx.shadowOffsetX = 2;
      ctx.shadowOffsetY = 3;

      // gradiente realista do papel (luz no topo, sombra embaixo)
      const grad = ctx.createLinearGradient(0,-s,0,s*0.9);
      grad.addColorStop(0, k.top);
      grad.addColorStop(0.55, k.top);
      grad.addColorStop(0.85, shade(k.bot, abs(40)));
      grad.addColorStop(1, shade(k.bot, abs(65)));
      ctx.fillStyle = grad;

      const fl = 1 + flap*0.08;
      const drawBody = () => {
        if (k.tipo === 'tesoura') {
          ctx.beginPath(); ctx.moveTo(-s*0.8*fl, -s*0.5); ctx.lineTo(-s*0.15, 0); ctx.lineTo(-s*0.8*fl, s*0.5); ctx.closePath(); ctx.fill();
          ctx.beginPath(); ctx.moveTo(s*0.8*fl, -s*0.5); ctx.lineTo(s*0.15, 0); ctx.lineTo(s*0.8*fl, s*0.5); ctx.closePath(); ctx.fill();
        } else if (k.tipo === 'quadrada') {
          ctx.fillRect(-s*0.5*fl, -s*0.5*fl, s*1.0*fl, s*1.0*fl);
        } else if (k.tipo === 'estrela') {
          ctx.beginPath();
          for (let i = 0; i < 10; i++) {
            const a = -Math.PI/2 + i*(Math.PI/5);
            const r = i%2===0 ? s*0.9 : s*0.42*fl;
            ctx.lineTo(Math.cos(a)*r, Math.sin(a)*r);
          }
          ctx.closePath(); ctx.fill();
        } else if (k.tipo === 'arraia') {
          ctx.beginPath(); ctx.moveTo(0,-s*0.5*fl); ctx.lineTo(s*0.85*fl,0); ctx.lineTo(0,s*0.32); ctx.lineTo(-s*0.85*fl,0); ctx.closePath(); ctx.fill();
        } else if (k.tipo === 'papagaio') {
          ctx.beginPath(); ctx.moveTo(0,-s*0.55); ctx.lineTo(s*0.75*fl,-s*0.1); ctx.lineTo(s*0.4,s*0.5); ctx.lineTo(-s*0.4,s*0.5); ctx.lineTo(-s*0.75*fl,-s*0.1); ctx.closePath(); ctx.fill();
        } else {
          const sw = s*0.55*fl, sh = s*0.75*fl;
          ctx.beginPath(); ctx.moveTo(0,-sh); ctx.lineTo(sw,0); ctx.lineTo(0,sh); ctx.lineTo(-sw,0); ctx.closePath(); ctx.fill();
        }
      };
      ctx.fillStyle = grad;
      drawBody();
      ctx.shadowBlur = 0; ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0;

      // dobra da vela (sombra no meio)
      ctx.strokeStyle = 'rgba(0,0,0,.18)';
      ctx.lineWidth = 1.5;
      if (k.tipo === 'losango') {
        ctx.beginPath(); ctx.moveTo(-s*0.9*fl,0); ctx.lineTo(s*0.9*fl,0); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0,-s*0.7*fl); ctx.lineTo(0,s*0.85*fl); ctx.stroke();
      } else if (k.tipo === 'quadrada') {
        ctx.strokeRect(-s*0.5*fl, -s*0.5*fl, s*1.0*fl, s*1.0*fl);
      } else if (k.tipo === 'tesoura') {
        ctx.beginPath(); ctx.moveTo(-s*0.55,0); ctx.lineTo(s*0.55,0); ctx.stroke();
      } else if (k.tipo === 'arraia') {
        ctx.beginPath(); ctx.moveTo(0,-s*0.5*fl); ctx.lineTo(0,s*0.32); ctx.stroke();
      } else if (k.tipo === 'papagaio') {
        ctx.beginPath(); ctx.moveTo(0,-s*0.5); ctx.lineTo(0,s*0.5); ctx.stroke();
      }

      // varetas (estrutura de madeira)
      ctx.strokeStyle = 'rgba(120,80,40,.5)';
      ctx.lineWidth = 1.2;
      if (k.tipo === 'losango' || k.tipo === 'arraia') {
        ctx.beginPath(); ctx.moveTo(0,-s*0.95*fl); ctx.lineTo(0,s); ctx.stroke();
      } else if (k.tipo === 'papagaio') {
        ctx.beginPath(); ctx.moveTo(0,-s*0.65); ctx.lineTo(0,s*0.6); ctx.stroke();
      }
      ctx.lineWidth = 0.8;
      if (k.tipo === 'losango') { ctx.beginPath(); ctx.moveTo(-s*1.0*fl,0); ctx.lineTo(s*1.0*fl,0); ctx.stroke(); }
      else if (k.tipo === 'quadrada') {
        ctx.beginPath(); ctx.moveTo(-s*0.45*fl,0); ctx.lineTo(s*0.45*fl,0); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0,-s*0.45*fl); ctx.lineTo(0,s*0.45*fl); ctx.stroke();
      }

      // brilho do papel (luz)
      ctx.fillStyle = 'rgba(255,255,255,.22)';
      if (k.tipo === 'losango') ctx.beginPath(); else ctx.beginPath();
      if (k.tipo === 'losango') {
        ctx.beginPath(); ctx.moveTo(-s*0.25*fl,-s*0.5*fl); ctx.lineTo(s*0.15*fl,-s*0.62*fl); ctx.lineTo(s*0.28*fl,-s*0.3*fl); ctx.lineTo(-s*0.05*fl,-s*0.2*fl); ctx.closePath(); ctx.fill();
      } else if (k.tipo === 'papagaio') {
        ctx.beginPath(); ctx.ellipse(0,-s*0.25, s*0.4, s*0.12, 0, 0, Math.PI*2); ctx.fill();
      }
      ctx.restore();
    }

    function drawBoy() {
      const gx = baseX, gy = baseY - 6;
      ctx.save();
      ctx.translate(gx, gy);
      ctx.scale(2.0, 2.0);
      // sombra
      ctx.fillStyle = 'rgba(0,0,0,.25)';
      ctx.beginPath(); ctx.ellipse(0, 1, 12, 3.2, 0, 0, Math.PI*2); ctx.fill();
      // pernas (jeans)
      ctx.fillStyle = '#3f5c8a';
      ctx.beginPath(); ctx.moveTo(-3,-2); ctx.lineTo(-6,12); ctx.lineTo(-3.5,12); ctx.lineTo(-1.5,-2); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(3,-2); ctx.lineTo(6,12); ctx.lineTo(3.5,12); ctx.lineTo(1.5,-2); ctx.closePath(); ctx.fill();
      // tênis
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.ellipse(-5,12.5,3.2,1.6,0,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(5,12.5,3.2,1.6,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = '#e63946';
      ctx.fillRect(-7,10.5,4,1.6);
      ctx.fillRect(6,10.5,4,1.6);
      // corpo (camiseta)
      ctx.fillStyle = '#ffd166';
      ctx.beginPath(); ctx.moveTo(-5,-13); ctx.lineTo(5,-13); ctx.lineTo(6.5,-2); ctx.lineTo(-6.5,-2); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#f5a623';
      ctx.beginPath(); ctx.moveTo(-2.8,-7); ctx.lineTo(0,-13); ctx.lineTo(2.8,-7); ctx.closePath(); ctx.fill();
      // mangas
      ctx.fillStyle = '#ffd166';
      ctx.beginPath(); ctx.ellipse(-5.5,-5,2.6,3.2,0.5,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(5.5,-5,2.6,3.2,-0.5,0,Math.PI*2); ctx.fill();
      // cabeça
      ctx.fillStyle = '#d9a066';
      ctx.beginPath(); ctx.arc(0,-18.5,6.5, 0, Math.PI*2); ctx.fill();
      // cabelo
      ctx.fillStyle = '#2c1e12';
      ctx.beginPath(); ctx.arc(0,-19.8,6.5, Math.PI*1.05, Math.PI*1.95); ctx.fill();
      // olho
      ctx.fillStyle = '#141414';
      ctx.beginPath(); ctx.arc(2.2,-18.5,0.9, 0, Math.PI*2); ctx.fill();
      // sorriso
      ctx.strokeStyle = '#b5632a'; ctx.lineWidth = 0.8;
      ctx.beginPath(); ctx.arc(0.8,-16.5,2.2, Math.PI*0.15, Math.PI*0.85); ctx.stroke();
      // braço esquerdo abaixado
      ctx.strokeStyle = '#d9a066'; ctx.lineWidth = 2.6; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(-5,-4); ctx.lineTo(-7,3); ctx.lineTo(-8,7); ctx.stroke();
      // braço direito levantando a linha
      ctx.strokeStyle = '#d9a066';
      ctx.beginPath(); ctx.moveTo(5,-5); ctx.lineTo(5.5,-13); ctx.lineTo(3.5,-19); ctx.stroke();
      // mão do carretel
      ctx.fillStyle = '#7a4a2b';
      ctx.beginPath(); ctx.arc(3.2,-19.5,2, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#5a3418'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(3.2,-19.5,2.6,0,Math.PI*2); ctx.stroke();
      ctx.restore();
    }

    function drawCloud(lazy) {
      const m = MAPS[mapIdx];
      clouds.forEach(c => {
        // sombra na base da nuvem
        ctx.fillStyle = shade(m.cloudCol, -60);
        ctx.beginPath();
        ctx.arc(c.x, c.y, c.w*0.30, 0, Math.PI*2);
        ctx.arc(c.x + c.w*0.32, c.y + 6, c.w*0.24, 0, Math.PI*2);
        ctx.arc(c.x + c.w*0.58, c.y + 4, c.w*0.25, 0, Math.PI*2);
        ctx.fill();
        // corpo da nuvem (claro)
        ctx.fillStyle = m.cloudCol;
        ctx.beginPath();
        ctx.arc(c.x - 4, c.y - 6, c.w*0.26, 0, Math.PI*2);
        ctx.arc(c.x + c.w*0.3 - 2, c.y - 12, c.w*0.20, 0, Math.PI*2);
        ctx.arc(c.x + c.w*0.55, c.y - 4, c.w*0.22, 0, Math.PI*2);
        ctx.arc(c.x + c.w*0.28, c.y + 2, c.w*0.26, 0, Math.PI*2);
        ctx.fill();
        // brilho superior (luz do sol)
        ctx.fillStyle = 'rgba(255,255,255,.5)';
        ctx.beginPath();
        ctx.arc(c.x, c.y - 9, c.w*0.16, 0, Math.PI*2);
        ctx.arc(c.x + c.w*0.3, c.y - 15, c.w*0.12, 0, Math.PI*2);
        ctx.fill();
      });
    }

    function drawGrass() {
      const colors = ['#4a7a2c', '#579336', '#3f6b26'];
      for (let i = 0; i < 70; i++) {
        const x = (i * 23 + Math.sin(i*7)*3) % W, grow = Math.sin(time*0.05 + i)*2;
        const gh = 6 + (i % 5) * 4;
        ctx.strokeStyle = colors[i % 3];
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.moveTo(x, GROUND + (i%6));
        ctx.quadraticCurveTo(x - 3, GROUND - gh*0.5 + grow, x - 5, GROUND - gh + grow);
        ctx.stroke();
        if (i % 3 === 0) { // flores brancas
          ctx.fillStyle = 'rgba(255,255,255,.8)';
          ctx.beginPath(); ctx.arc(x + 4, GROUND + 8, 2, 0, Math.PI*2); ctx.fill();
          ctx.fillStyle = '#ffd166';
          ctx.beginPath(); ctx.arc(x + 4, GROUND + 8, 1, 0, Math.PI*2); ctx.fill();
        }
      }
    }

    function drawBackdrop() {
      const m = MAPS[mapIdx];
      ctx.fillStyle = m.themeBackdrop ? m.themeBackdrop : 'rgba(60,100,60,.5)';
      // árvores distantes
      for (let i = 0; i < 5; i++) {
        const x = (i * 78 + 20) % W, ty = GROUND;
        ctx.fillStyle = 'rgba(40,80,40,.35)';
        ctx.beginPath();
        ctx.moveTo(x, ty + 4);
        ctx.quadraticCurveTo(x - 12, ty - 22, x - 18, ty - 40);
        ctx.quadraticCurveTo(x, ty - 52, x + 18, ty - 40);
        ctx.quadraticCurveTo(x + 12, ty - 22, x, ty + 4);
        ctx.fill();
      }
      // linha do horizonte para suavizar transição
      ctx.fillStyle = 'rgba(50,80,40,.3)';
      ctx.fillRect(0, GROUND - 2, W, 5);
    }

    // outras pessoas soltando pipa (cenário)
    function drawNPCs() {
      npcs.forEach(n => {
        // linha da pipa
        ctx.strokeStyle = 'rgba(220,220,220,.5)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(n.px, GROUND - 2);
        ctx.quadraticCurveTo(n.px + Math.sin(time*0.03+n.bob)*8, (GROUND-2+n.ky)/2, n.kx + Math.sin(time*0.02+n.bob)*6, n.ky);
        ctx.stroke();
        // pipa pequena
        const s = n.size;
        ctx.save();
        ctx.translate(n.kx + Math.sin(time*0.02+n.bob)*6, n.ky + Math.sin(time*0.03+n.bob)*4);
        ctx.rotate(0.2);
        const g = ctx.createLinearGradient(0,-s,0,s);
        g.addColorStop(0, n.col[0]); g.addColorStop(1, n.col[1]);
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.moveTo(0,-s*0.75); ctx.lineTo(s*0.55,0); ctx.lineTo(0,s*0.75); ctx.lineTo(-s*0.55,0); ctx.closePath(); ctx.fill();
        ctx.restore();
        // pessoa pequena
        ctx.fillStyle = '#2e4a24';
        ctx.beginPath(); ctx.arc(n.px, GROUND - 4, 3.5, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#e8c9a0';
        ctx.beginPath(); ctx.arc(n.px, GROUND - 9, 2.5, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#7a4a2b';
        ctx.fillRect(n.px - 1.5, GROUND - 2, 3, 3);
      });
    }

    function drawPickups() {
      pickups.forEach(p => {
        if (p.type === 'star') {
          ctx.fillStyle = '#ffd166';
          ctx.beginPath();
          for (let i = 0; i < 5; i++) {
            const a = -Math.PI/2 + i*(Math.PI*2/5);
            const a2 = a + Math.PI/5;
            ctx.lineTo(p.x + Math.cos(a)*7, p.y + Math.sin(a)*7);
            ctx.lineTo(p.x + Math.cos(a2)*3, p.y + Math.sin(a2)*3);
          }
          ctx.closePath(); ctx.fill();
          ctx.fillStyle = 'rgba(255,255,255,.6)';
          ctx.beginPath(); ctx.arc(p.x-2, p.y-2, 1.5, 0, Math.PI*2); ctx.fill();
        } else if (p.type === 'cloud') {
          ctx.fillStyle = 'rgba(255,255,255,.9)';
          ctx.beginPath();
          ctx.arc(p.x, p.y, 8, 0, Math.PI*2);
          ctx.arc(p.x+9, p.y-3, 6, 0, Math.PI*2);
          ctx.arc(p.x+14, p.y, 7, 0, Math.PI*2);
          ctx.fill();
          ctx.fillStyle = '#ff78c9';
          ctx.font = '9px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('+5', p.x+14, p.y+3);
        }
      });
    }

    function drawBird(b) {
      ctx.fillStyle = '#26303a';
      ctx.beginPath();
      ctx.ellipse(b.x, b.y, 8, 3.5, 0, 0, Math.PI*2);
      ctx.fill();
      const w = Math.sin(time*0.3 + b.ph)*0.7;
      ctx.beginPath();
      ctx.moveTo(b.x - 6, b.y - 2);
      ctx.quadraticCurveTo(b.x - 10, b.y - 8 - w*4, b.x - 2, b.y - 4 - w*3);
      ctx.quadraticCurveTo(b.x - 8, b.y - 3, b.x - 6, b.y - 2);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(b.x + 6, b.y - 2);
      ctx.quadraticCurveTo(b.x + 10, b.y - 8 - w*4, b.x + 2, b.y - 4 - w*3);
      ctx.quadraticCurveTo(b.x + 8, b.y - 3, b.x + 6, b.y - 2);
      ctx.fill();
    }

    // pipa inimiga (de outro "personagem" no topo do céu)
    function drawEnemy(e) {
      const c1 = e.col[0], c2 = e.col[1];
      // linha da pipa inimiga (abc no topo)
      ctx.strokeStyle = 'rgba(200,200,210,.55)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(e.ax, -8);
      ctx.quadraticCurveTo(e.ax + Math.sin(time*0.02 + e.o)*2, e.y/2, e.x, e.y);
      ctx.stroke();

      ctx.save();
      ctx.translate(e.x, e.y);
      ctx.rotate(Math.sin(time*0.1 + e.o)*0.1);
      ctx.shadowColor = 'rgba(0,0,0,.3)'; ctx.shadowBlur = 3; ctx.shadowOffsetY = 2;
      const g = ctx.createLinearGradient(0,-12,0,12);
      g.addColorStop(0, c1); g.addColorStop(1, c2);
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.moveTo(0,-13); ctx.lineTo(9,0); ctx.lineTo(0,13); ctx.lineTo(-9,0); ctx.closePath(); ctx.fill();
      ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
      ctx.beginPath(); ctx.moveTo(0,-13); ctx.lineTo(9,0); ctx.lineTo(0,13); ctx.lineTo(-9,0); ctx.closePath(); ctx.strokeStyle='rgba(0,0,0,.2)'; ctx.stroke();
      ctx.restore();
    }

    // ponto mais próximo entre o jogador (linha do mão até kite) e a linha inimiga (ax->e)
    function lineHit() {
      const A = handPos();
      for (const e of enemies) {
        const B = { x: kite.x, y: kite.y };
        const E1 = { x: e.ax, y: -8 }, E2 = { x: e.x, y: e.y };
        // amostra a curva do jogador e verifica distância ao segmento E1->E2
        for (let t2 = 0; t2 <= 1.001; t2 += 0.07) {
          const px = (1-t2)*(1-t2)*A.x + 2*(1-t2)*t2*e.mx + t2*t2*B.x;
          const py = (1-t2)*(1-t2)*A.y + 2*(1-t2)*t2*e.my + t2*t2*B.y;
          const d = segDist(px, py, E1, E2);
          if (d < 7) return e;
        }
      }
      return null;
    }
    function segDist(px, py, A, B) {
      const dx = B.x - A.x, dy = B.y - A.y;
      const L2 = dx*dx + dy*dy;
      let t = L2 ? ((px-A.x)*dx + (py-A.y)*dy) / L2 : 0;
      t = Math.max(0, Math.min(1, t));
      const x = A.x + t*dx, y = A.y + t*dy;
      return Math.hypot(px - x, py - y);
    }

    function drawGusts() {
      gusts.forEach(g => {
        ctx.strokeStyle = 'rgba(255,255,255,' + (g.life/30*g.op) + ')';
        ctx.lineWidth = 2;
        ctx.beginPath();
        const off = Math.sin(g.y*0.1 + time*0.1)*4;
        ctx.moveTo(g.x - g.len, g.y + off);
        ctx.lineTo(g.x + g.len, g.y - off);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(g.x - g.len*0.5, g.y + off + 4);
        ctx.lineTo(g.x + 4, g.y - off + 2);
        ctx.stroke();
      });
    }

    // ---------- loop ----------
    function loop() {
      if (!running) { return; }
      const m = MAPS[mapIdx];
      time++;

      // céu com gradient realista + névoa no horizonte
      const sky = ctx.createLinearGradient(0, 0, 0, H*0.85);
      sky.addColorStop(0, m.sky[0]);
      sky.addColorStop(0.6, m.sky[1]);
      sky.addColorStop(1, m.sky[0]);
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, W, H);

      // brilho do sol (overlay radial) para dar profundidade
      let sunX = W*0.78, sunY = 50, sunCol = '255,220,90';
      if (m.storm) { sunCol = '230,230,255'; }
      else if (m.name === 'Tarde') { sunCol = '255,170,60'; }
      else if (m.name === 'Noite') { sunCol = '200,210,255'; }
      const sunGlow = ctx.createRadialGradient(sunX, sunY, 5, sunX, sunY, H*0.42);
      sunGlow.addColorStop(0, 'rgba(' + sunCol + ',.55)');
      sunGlow.addColorStop(1, 'rgba(' + sunCol + ',0)');
      ctx.fillStyle = sunGlow;
      ctx.fillRect(0, 0, W, H*0.8);

      // raios suaves do sol girando devagar
      if (m.gust >= 0) {
        ctx.save();
        ctx.translate(sunX, sunY);
        ctx.rotate(time*0.004);
        for (let i = 0; i < 8; i++) {
          ctx.rotate(Math.PI/4);
          ctx.fillStyle = 'rgba(' + sunCol + ',' + (m.storm ? 0.05 : 0.10) + ')';
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(150, -12);
          ctx.lineTo(170, 0);
          ctx.lineTo(150, 12);
          ctx.closePath();
          ctx.fill();
        }
        // halo brilhante ao redor do sol
        ctx.fillStyle = 'rgba(' + sunCol + ',.30)';
        ctx.beginPath(); ctx.arc(0, 0, 34, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = 'rgba(' + sunCol + ',.45)';
        ctx.beginPath(); ctx.arc(0, 0, 22, 0, Math.PI*2); ctx.fill();
        ctx.restore();
      }

      // névoa / perspectiva atmosférica perto do horizonte
      const hazeY = H*0.7;
      const haze = ctx.createLinearGradient(0, hazeY - 70, 0, hazeY + 20);
      haze.addColorStop(0, 'rgba(' + (m.storm?'120,130,160': '220,240,255') + ',0)');
      haze.addColorStop(1, 'rgba(' + (m.storm?'90,100,130': '200,225,245') + ',.6)');
      ctx.fillStyle = haze;
      ctx.fillRect(0, hazeY - 70, W, 90);

      // chão / campo com textura de grama
      const gg_grad = ctx.createLinearGradient(0, GROUND, 0, H);
      gg_grad.addColorStop(0, m.themeGrass ? m.themeGrass[0] : '#5d8f3b');
      gg_grad.addColorStop(1, '#2e4a24');
      ctx.fillStyle = gg_grad;
      ctx.fillRect(0, GROUND, W, H - GROUND);
      // listras do gramado
      ctx.strokeStyle = 'rgba(60,110,40,.35)';
      ctx.lineWidth = 2;
      for (let i = 0; i < 18; i++) {
        const xx = (i * 18 + Math.sin(time*0.01+i)*2);
        ctx.beginPath();
        ctx.moveTo(xx, GROUND + 6);
        ctx.lineTo(xx - 4, H);
        ctx.stroke();
      }
      // tufos de grama
      drawGrass();

      // árvores/casas no fundo: pequenas silhuetas distantes
      drawBackdrop();

      // pessoas soltando pipa no cenário
      drawNPCs();

      // estrelas à noite
      if (m.stars) {
        starsBg.forEach(s => {
          ctx.fillStyle = 'rgba(255,255,220,' + (0.4 + Math.sin(time*0.05+s.t)*0.3) + ')';
          ctx.fillRect(s.x, s.y, s.s, s.s);
        });
      }
      // sol/lua + raio na tempestade
      if (m.storm) {
        ctx.fillStyle = 'rgba(230,230,255,.8)';
        ctx.beginPath(); ctx.arc(W*0.78, 50, 20, 0, Math.PI*2); ctx.fill();
        if (time % 60 < 4) {
          ctx.strokeStyle = 'rgba(255,255,200,.8)';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(90, 30); ctx.lineTo(130, 60); ctx.lineTo(115, 60); ctx.lineTo(150, 95);
          ctx.stroke();
        }
      } else if (m.name === 'Noite') {
        ctx.fillStyle = 'rgba(240,240,255,.95)';
        ctx.beginPath(); ctx.arc(W*0.78, 50, 24, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = m.sky[0];
        ctx.beginPath(); ctx.arc(W*0.78, 47, 20, 0, Math.PI*2); ctx.fill();
      } else {
        ctx.fillStyle = m.name === 'Tarde' ? 'rgba(255,170,60,.95)' : 'rgba(255,220,90,.95)';
        ctx.beginPath(); ctx.arc(W*0.78, 50, 30, 0, Math.PI*2); ctx.fill();
      }

      drawCloud();
      drawGusts();

      // vento variável
      windPhase += 0.02;
      wind = Math.sin(windPhase) * 0.7 + Math.sin(windPhase*0.4)*0.3;
      if (m.gust > 0 && Math.random() < m.gust) {
        gusts.push({ x: Math.random()*W, y: 40 + Math.random()*H*0.5, len: 30 + Math.random()*40, life: 30, op: 0.4+Math.random()*0.4 });
      }
      gusts = gusts.filter(g => --g.life > 0);

      // controle
      let ax = 0, ay = 0;
      if (keys['arrowleft'] || keys['a']) ax -= 0.12;
      if (keys['arrowright'] || keys['d']) ax += 0.12;
      if (keys['arrowup'] || keys['w']) ay -= 0.10;
      if (keys['arrowdown'] || keys['s']) ay += 0.10;
      if (touch) {
        const rect = cv.getBoundingClientRect();
        const s = W / rect.width; // converte px da tela -> espaço lógico 360
        const lx = (touch.clientX - rect.left) * s;
        const ly = (touch.clientY - rect.top) * s;
        const dx = lx - kite.x;
        const dy = ly - kite.y;
        ax += Math.max(-1, Math.min(1, dx/90)) * 0.14;
        ay += Math.max(-1, Math.min(1, dy/90)) * 0.14;
      }
      kite.vx += ax;
      kite.vy += ay;
      // vento empurra
      kite.vx += wind * 0.015;
      // "linha esticada": não deixa a pipa escapar demais
      const dx = kite.x - baseX, dy = kite.y - baseY;
      const dist = Math.hypot(dx, dy);
      if (dist > MAX_DIST) {
        kite.vx -= dx/dist * 0.03;
        kite.vy -= dy/dist * 0.03;
      }
      kite.vx *= 0.93; kite.vy *= 0.93;
      kite.x += kite.vx; kite.y += kite.vy;
      kite.flap += 0.05;
      // limites
      kite.x = Math.max(14, Math.min(W-14, kite.x));
      kite.y = Math.max(20, Math.min(GROUND, kite.y));
      // se a pipa encostar no chão/cabeça do menino => perde vida
      if (kite.y >= GROUND - 4) {
        lives--;
        kite.y = H*0.4; kite.vy = 0;
        document.getElementById('lives').textContent = lives;
        if (lives <= 0) { gameOver(false); return; }
      }

      // spawn de itens
      spawnT++;
      const interval = Math.max(28, 60 - score*0.02);
      if (spawnT > interval) {
        spawnT = 0;
        const r = Math.random();
        if (r < 0.65) {
          pickups.push({ type:'star', x: 20 + Math.random()*(W-40), y: -12, vy: 1 + Math.random()*1.2 });
        } else if (r < 0.85) {
          pickups.push({ type:'cloud', x: 20 + Math.random()*(W-40), y: -12, vy: 0.8 + Math.random() });
        } else {
          birds.push({ x: Math.random()<0.5 ? -14 : W+14, y: 40 + Math.random()*H*0.5, v: (Math.random()<0.5?-1:1) * (1 + m.birds), ph: Math.random()*6 });
        }
      }

      // itens
      for (let i = pickups.length-1; i >= 0; i--) {
        const p = pickups[i];
        p.y += p.vy;
        if (p.y > H) { pickups.splice(i,1); continue; }
        if (Math.abs(p.x - kite.x) < 16 && Math.abs(p.y - kite.y) < 16) {
          if (p.type === 'star') { addScore(1); particles.push({x:p.x,y:p.y,c:'#ffd166'}); }
          else { addScore(5); particles.push({x:p.x,y:p.y,c:'#ff78c9'}); }
          document.getElementById('score').textContent = score;
          pickups.splice(i,1);
          continue;
        }
        if (p.type === 'star') {
          ctx.fillStyle = '#ffd166';
          ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(Math.sin(time*0.1)*0.3);
          ctx.beginPath();
          for (let s2=0;s2<5;s2++){const a=-Math.PI/2+s2*(Math.PI*2/5);ctx.lineTo(Math.cos(a)*7,Math.sin(a)*7);ctx.lineTo(Math.cos(a+Math.PI/5)*3,Math.sin(a+Math.PI/5)*3);}
          ctx.closePath(); ctx.fill(); ctx.restore();
        } else {
          ctx.fillStyle = 'rgba(255,255,255,.9)';
          ctx.beginPath();
          ctx.arc(p.x,p.y,8,0,Math.PI*2); ctx.arc(p.x+9,p.y-3,6,0,Math.PI*2); ctx.arc(p.x+14,p.y,7,0,Math.PI*2);
          ctx.fill();
          ctx.fillStyle = '#ff78c9'; ctx.font='9px sans-serif'; ctx.textAlign='center';
          ctx.fillText('+5', p.x+14, p.y+3);
        }
      }

      // pássaros
      for (let i = birds.length-1; i >= 0; i--) {
        const b = birds[i];
        b.x += b.v;
        if (b.x < -20 || b.x > W+20) { birds.splice(i,1); continue; }
        drawBird(b);
        if (invuln === 0 && Math.abs(b.x - kite.x) < 18 && Math.abs(b.y - kite.y) < 14) {
          birds.splice(i,1);
          lives--;
          invuln = 60;
          particles.push({x:kite.x,y:kite.y,c:'#e63946'});
          document.getElementById('lives').textContent = lives;
          if (lives <= 0) { gameOver(false); return; }
        }
      }
      if (invuln > 0) invuln--;

      // pipas inimigas — spawn e corte de linha (linha cortante / cerol)
      if (enemies.length < 3 && Math.random() < 0.004) {
        const ex = 40 + Math.random() * (W - 80);
        const ey = 60 + Math.random() * (H*0.3);
        enemies.push({
          x: ex, y: ey,
          ax: ex,                          // âncora no topo (onde a linha começa)
          mx: ex + (Math.random()-0.5)*40, // ponto de controle da curva da linha
          my: ey*0.4,
          o: Math.random()*6,
          col: [['#111','#222'],['#d6d6de','#e8e8ef'],['#f4a261','#e76f51']][Math.floor(Math.random()*3)],
          fall: false, rot: 0
        });
      }
      // atualiza/desenha inimigas
      for (let i = enemies.length-1; i >= 0; i--) {
        const e = enemies[i];
        if (e.fall) {
          e.y += 5; e.x += Math.sin(e.rot)*2; e.rot += 0.2;
          if (e.y > H + 40) { enemies.splice(i,1); continue; }
          drawEnemy(e);
        } else {
          // flutua suavemente
          e.y += Math.sin(time*0.02 + e.o)*0.4;
          e.x += Math.sin(time*0.03 + e.o)*0.3;
          drawEnemy(e);
          // CORTE: se a linha do jogador cruzar a linha inimiga
          if (invuln === 0 && lineHit()) {
            e.fall = true;
            addScore(3);
            cutFl = 12;
            particles.push({x:e.x,y:e.y,c:'#ff6b6b'});
            document.getElementById('score').textContent = score;
          }
          // colisão com o corpo da pipa inimiga
          if (invuln === 0 && Math.abs(e.x - kite.x) < 20 && Math.abs(e.y - kite.y) < 18) {
            e.fall = true;
            lives--;
            invuln = 60;
            particles.push({x:kite.x,y:kite.y,c:'#e63946'});
            document.getElementById('lives').textContent = lives;
            if (lives <= 0) { gameOver(false); return; }
          }
        }
      }
      if (cutFl > 0) cutFl--;

      // partículas
      particles.forEach(p => { p.y += 0.5; });
      particles = particles.filter(p => p.y < H);

      // pipa e linha
      drawString(kite.x, kite.y, wind);
      if (invuln === 0 || Math.floor(invuln/8)%2===0) drawKite(kite.x, kite.y, 34, Math.sin(kite.flap));

      // gradiente da pipa desenha depois; desenha o menino por cima
      drawBoy();

      // partículas novamente por cima
      particles.forEach(p => {
        ctx.fillStyle = p.c; ctx.globalAlpha = 0.8;
        ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI*2); ctx.fill();
        ctx.globalAlpha = 1;
      });

      requestAnimationFrame(loop);
    }
    let gg = 0;
  </script>
</body>
</html>
