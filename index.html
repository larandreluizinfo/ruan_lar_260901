<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Corrida Moto &amp; Carro</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a2e;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      color: #fff;
    }
    canvas { display: block; background: #2d2a32; border-radius: 8px; box-shadow: 0 0 30px rgba(0,0,0,.6); }
    #game {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    #hud {
      width: 100%;
      display: flex;
      justify-content: space-between;
      padding: 10px 4px;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 1px;
    }
    #hud span { color: #ffd166; }
    #overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      background: rgba(20,20,40,.85);
      border-radius: 8px;
      z-index: 10;
      text-align: center;
      padding: 20px;
    }
    #overlay h1 { font-size: 34px; margin-bottom: 6px; }
    #overlay p { margin: 6px 0 16px; color: #ccc; max-width: 320px; }
    #overlay .select { display: flex; gap: 16px; }
    .option {
      background: #33334e;
      border: 3px solid transparent;
      border-radius: 12px;
      padding: 14px 22px;
      cursor: pointer;
      transition: .2s;
      font-size: 18px;
      font-weight: 700;
    }
    .option:hover { border-color: #ffd166; transform: translateY(-3px); }
    .option small { display: block; font-weight: 400; font-size: 13px; color: #aaa; margin-top: 4px; }
    .option.car { background: #e65c3a; color: #fff; }
    .option.moto { background: #3a86e6; color: #fff; }
    #startBtn {
      margin-top: 18px;
      padding: 14px 32px;
      font-size: 20px;
      font-weight: 800;
      border: none;
      border-radius: 10px;
      background: #ffd166;
      color: #222;
      cursor: pointer;
      letter-spacing: 1px;
      transition: .2s;
    }
    #startBtn:hover { transform: scale(1.06); }
    #scoreBig { font-size: 22px; margin: 8px 0; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="game">
    <div id="hud">
      <div>Pontos: <span id="score">0</span></div>
      <div>Velocidade: <span id="speed">0</span> km/h</div>
    </div>
    <canvas id="cv" width="420" height="640"></canvas>
    <div id="overlay">
      <h1>🏁 Moto &amp; Carro</h1>
      <p>Escolha seu veículo, desvie do tráfego e colete o máximo de pontos possível!</p>
      <div class="select">
        <div class="option car" onclick="choose('car')">🚗 <small>Carro</small></div>
        <div class="option moto" onclick="choose('moto')">🏍️ <small>Moto</small></div>
      </div>
      <button id="startBtn" onclick="startGame()">Começar</button>
      <div id="scoreBig" class="hidden"></div>
    </div>
  </div>

  <script>
    const cv = document.getElementById('cv');
    const ctx = cv.getContext('2d');
    const W = cv.width, H = cv.height;

    let vehicle = null;
    let player = { x: 0, y: 0, w: 0, h: 0, speed: 0 };
    let score = 0, best = (localStorage.getItem('best')|0), running = false;
    let obstacles = [], roadOffset = 0, spawnTimer = 0, speedLabel = 0;

    const lanes = 3;
    const roadLeft = 40, roadWidth = W - 80, laneWidth = roadWidth / lanes;

    function choose(v) {
      vehicle = v;
      if (v === 'car') {
        player.w = 46; player.h = 80;
      } else {
        player.w = 26; player.h = 56;
      }
      player.x = (W - player.w) / 2;
      player.y = H - player.h - 30;
    }

    function startGame() {
      if (!vehicle) return;
      document.getElementById('overlay').classList.add('hidden');
      score = 0; obstacles = []; running = true; spawnTimer = 0;
      player.y = H - player.h - 30;
      document.getElementById('scoreBig').classList.add('hidden');
      requestAnimationFrame(loop);
    }

    function gameOver() {
      running = false;
      if (score > best) { best = score; localStorage.setItem('best', best); }
      const sb = document.getElementById('scoreBig');
      sb.classList.remove('hidden');
      sb.innerHTML = 'Fim de jogo! Pontos: ' + score + '<br>Recorde: ' + best;
      const btn = document.getElementById('startBtn');
      btn.textContent = 'Jogar novamente';
      btn.style.display = '';
      document.getElementById('overlay').classList.remove('hidden');
      document.getElementById('overlay').querySelector('.select').style.display = 'none';
      document.getElementById('overlay').querySelector('.select').insertAdjacentHTML('afterend','');
      btn.onclick = () => {
        document.getElementById('overlay').classList.add('hidden');
        startGame();
      };
    }

    const keys = {};
    window.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; });
    window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

    function drawVehicle(x, y, w, h, isPlayer) {
      ctx.save();
      // corpo
      const grad = ctx.createLinearGradient(x, y, x + w, y);
      grad.addColorStop(0, isPlayer ? '#ffd166' : '#7a7a8a');
      grad.addColorStop(0.5, isPlayer ? '#ff9f1c' : '#999aa8');
      grad.addColorStop(1, isPlayer ? '#e76f51' : '#6a6a78');
      ctx.fillStyle = grad;
      ctx.fillRect(x, y, w, h);
      // para-brisa
      ctx.fillStyle = isPlayer ? '#1d3557' : '#31445e';
      ctx.fillRect(x + w * 0.2, y + h * 0.12, w * 0.6, h * 0.2);
      // rodas
      ctx.fillStyle = '#111';
      ctx.fillRect(x - 4, y + h * 0.18, 6, h * 0.22);
      ctx.fillRect(x + w - 2, y + h * 0.18, 6, h * 0.22);
      ctx.fillRect(x - 4, y + h * 0.62, 6, h * 0.22);
      ctx.fillRect(x + w - 2, y + h * 0.62, 6, h * 0.22);
      ctx.fillStyle = '#ddd';
      ctx.fillRect(x + w * 0.2, y + h * 0.72, w * 0.6, h * 0.06);
      ctx.restore();
    }

    function drawRoad() {
      // estrada
      ctx.fillStyle = '#3a3f47';
      ctx.fillRect(roadLeft, 0, roadWidth, H);
      // bordas
      ctx.fillStyle = '#fff';
      ctx.fillRect(roadLeft - 6, 0, 6, H);
      ctx.fillRect(roadLeft + roadWidth, 0, 6, H);
      // faixas
      roadOffset += 6;
      if (roadOffset > 40) roadOffset = 0;
      ctx.fillStyle = '#ffd166';
      for (let i = 1; i < lanes; i++) {
        const lx = roadLeft + i * laneWidth - 2;
        for (let y = -40 + roadOffset; y < H; y += 80) {
          ctx.fillRect(lx, y, 4, 40);
        }
      }
    }

    function spawn() {
      const lane = Math.floor(Math.random() * lanes);
      const ox = roadLeft + lane * laneWidth + (laneWidth - 46) / 2;
      obstacles.push({ x: ox, y: -90, w: 46, h: 80, speed: 2 + Math.random() * 2 });
    }

    function loop() {
      if (!running) return;
      const spd = Math.min(10, 3 + score / 25);
      player.speed = spd;
      speedLabel = Math.round(spd * 14);
      document.getElementById('speed').textContent = speedLabel;

      if (keys['arrowleft'] || keys['a']) player.x -= 7;
      if (keys['arrowright'] || keys['d']) player.x += 7;
      if (keys['arrowup'] || keys['w']) player.y -= 6;
      if (keys['arrowdown'] || keys['s']) player.y += 6;
      player.x = Math.max(roadLeft + 8, Math.min(roadLeft + roadWidth - player.w - 8, player.x));
      player.y = Math.max(30, Math.min(H - player.h - 10, player.y));

      // spawn
      spawnTimer++;
      if (spawnTimer > Math.max(20, 45 - score / 10)) { spawn(); spawnTimer = 0; }

      drawRoad();

      // movimento e colisão dos obstáculos
      ctx.fillStyle = '#e15249';
      for (let i = obstacles.length - 1; i >= 0; i--) {
        const o = obstacles[i];
        o.y += o.speed;
        drawVehicle(o.x, o.y, o.w, o.h, false);
        // colisão
        if (player.x < o.x + o.w && player.x + player.w > o.x &&
            player.y < o.y + o.h && player.y + player.h > o.y) {
          drawVehicle(player.x, player.y, player.w, player.h, true);
          gameOver();
          return;
        }
        if (o.y > H + 100) {
          obstacles.splice(i, 1);
          score++;
          document.getElementById('score').textContent = score;
        }
      }

      drawVehicle(player.x, player.y, player.w, player.h, true);
      requestAnimationFrame(loop);
    }
  </script>
</body>
</html>
